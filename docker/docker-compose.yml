# One-command build + run:
#
#   cd docker
#   docker compose up --build -d
#
# Custom port (host and container both use it -- no file editing needed):
#
#   PORT=9000 docker compose up --build -d
#
# Or put PORT=9000 in a .env file next to this one (copy .env.example).
#
# Persian (RTL) interface instead of English:
#
#   APP_LANG=fa docker compose up --build -d
#
# Stop it with:
#
#   docker compose down
#
services:
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pyshiny:latest
    container_name: pyshiny
    environment:
      PORT: "${PORT:-8000}"
      APP_LANG: "${APP_LANG:-en}"   # "en" (LTR) or "fa" (RTL) -- see i18n.py
      # First run only (empty database): superadmin password. Leave empty to get
      # a random one (printed in `docker logs`, saved to db/initial_superadmin_password.txt).
      INITIAL_SUPERADMIN_PASSWORD: "${INITIAL_SUPERADMIN_PASSWORD:-}"
      DEMO_ACCOUNTS: "${DEMO_ACCOUNTS:-0}"         # 1 = also create admin/user/guest demo accounts
      SESSION_MAX_HOURS: "${SESSION_MAX_HOURS:-12}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-0}"  # 1 only behind your own reverse proxy
      HSTS: "${HSTS:-0}"                            # 1 only when served over HTTPS
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      # Persists db/auth.db (accounts, roles, password hashes) across
      # restarts and rebuilds. auth/core.py creates and seeds it
      # automatically the first time the container starts.
      - ../db:/app/db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
